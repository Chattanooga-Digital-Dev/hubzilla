# Nginx Configuration for Staging/Production
# HTTP only - Traefik handles HTTPS termination
# This config is used when deployed via docker-stack.yml

server {
    listen 80;
    server_name _;
    
    root /var/www/html;
    index index.php;
    
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?q=$1;
        }
    }
    
    location ^~ /.well-known/ {
        allow all;
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?q=$1;
        }
    }
    
    location ~* \.php$ {
        # Increased timeouts for ARM architecture performance
        fastcgi_read_timeout 300s;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Use Traefik forwarded headers if present, otherwise use actual values
        set $custom_host $host;
        if ($http_x_forwarded_host != "") {
            set $custom_host $http_x_forwarded_host;
        }
        fastcgi_param HTTP_HOST $custom_host;
        fastcgi_param SERVER_NAME $custom_host;
        
        # Tell PHP we're behind HTTPS if Traefik says so (this is critical for Hubzilla)
        set $custom_https "";
        if ($http_x_forwarded_proto = "https") {
            set $custom_https "on";
        }
        fastcgi_param HTTPS $custom_https;
    }
    
    location ~* \.(tpl|md|tgz|log|out)$ {
        deny all;
    }
    
    location ~ /\. {
        deny all;
    }
    
    location ~ /store {
        deny all;
    }
    
    location ~ /util {
        deny all;
    }
}
