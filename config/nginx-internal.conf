# Nginx Configuration for Local Development
# Used with docker-compose.yml
# Includes both HTTP (port 80) and HTTPS (port 443) blocks
# The HTTPS block is for direct testing with mkcert certificates

# HTTP server on port 80 - for Traefik routing
server {
    listen 80;
    server_name _;
    
    root /var/www/html;
    index index.php;
    
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?q=$1;
        }
    }
    
    location ^~ /.well-known/ {
        allow all;
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?q=$1;
        }
    }
    
    location ~* \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Use Traefik forwarded headers if present, otherwise use actual values
        set $custom_host $host;
        if ($http_x_forwarded_host != "") {
            set $custom_host $http_x_forwarded_host;
        }
        fastcgi_param HTTP_HOST $custom_host;
        fastcgi_param SERVER_NAME $custom_host;
        
        # Tell PHP we're behind HTTPS if Traefik says so
        set $custom_https "";
        if ($http_x_forwarded_proto = "https") {
            set $custom_https "on";
        }
        fastcgi_param HTTPS $custom_https;
    }
    
    location ~* \.(tpl|md|tgz|log|out)$ {
        deny all;
    }
    
    location ~ /\. {
        deny all;
    }
    
    location ~ /store {
        deny all;
    }
    
    location ~ /util {
        deny all;
    }
}

# HTTPS server on port 443 - for internal testing only
server {
    listen 443 ssl http2;
    server_name localhost;
    
    root /var/www/html;
    index index.php;
    
    # SSL configuration for internal testing
    ssl_certificate /var/ssl-shared/localhost.pem;
    ssl_certificate_key /var/ssl-shared/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?q=$1;
        }
    }
    
    location ^~ /.well-known/ {
        allow all;
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?q=$1;
        }
    }
    
    location ~* \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        
        # Use Traefik forwarded headers if present, otherwise use actual values
        set $custom_host $host;
        if ($http_x_forwarded_host != "") {
            set $custom_host $http_x_forwarded_host;
        }
        fastcgi_param HTTP_HOST $custom_host;
        fastcgi_param SERVER_NAME $custom_host;
    }
    
    location ~* \.(tpl|md|tgz|log|out)$ {
        deny all;
    }
    
    location ~ /\. {
        deny all;
    }
    
    location ~ /store {
        deny all;
    }
    
    location ~ /util {
        deny all;
    }
}
