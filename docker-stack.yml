version: '3.8'

networks:
  traefik_net:
    external: true
  hubzilla_internal:
    driver: overlay
    attachable: true

services:
  hub_db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hubzilla_internal
    volumes:
      - db_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  hub:
    image: catmanmatt/hubzilla-pg-nginx:v7
    configs:
      - source: nginx_production_config
        target: /etc/nginx/http.d/default.conf
      - source: secrets_loader
        target: /usr/local/bin/load-secrets.sh
        mode: 0755
    environment:
      - DOMAIN=${DOMAIN}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - TIMEZONE=${TIMEZONE}
      - REQUIRE_EMAIL=${REQUIRE_EMAIL}
      - REGISTER_POLICY=${REGISTER_POLICY}
      - ADDON_LIST=${ADDON_LIST}
      - DB_HOST=hub_db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_TYPE=${DB_TYPE}
      - DB_PORT=${DB_PORT}
      - SMTP_HOST=mail_stalwart
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_DOMAIN=${SMTP_DOMAIN}
      - SMTP_USER=${SMTP_USER}
      - SMTP_USE_STARTTLS=${SMTP_USE_STARTTLS}
      - ENABLE_LOGROT=${ENABLE_LOGROT}
      - LOGROT_PATH=${LOGROT_PATH}
      - LOGROT_SIZE=${LOGROT_SIZE}
      - LOGROT_MAXFILES=${LOGROT_MAXFILES}
      - DEBUG_PHP=${DEBUG_PHP}
    secrets:
      - db_password
      - smtp_password
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        source /usr/local/bin/load-secrets.sh
        exec /usr/local/bin/entrypoint.sh supervisord -c /etc/supervisord.conf
    networks:
      - traefik_net
      - hubzilla_internal
    volumes:
      - web_root:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.hubzilla.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.hubzilla.entrypoints=websecure"
        - "traefik.http.routers.hubzilla.tls=true"
        - "traefik.http.routers.hubzilla.tls.certresolver=le"
        - "traefik.http.services.hubzilla.loadbalancer.server.port=80"
        - "traefik.swarm.network=traefik_net"
        # Staging Auth Middleware
        # - "traefik.http.middlewares.staging-auth.basicauth.users=dev-team:$$apr1$$8ILEy6GR$$EnCSTIPn3LWvb1Z79/Wog/"
        # - "traefik.http.routers.hubzilla.middlewares=staging-auth"
      restart_policy:
        condition: on-failure

  hub_cron:
    image: catmanmatt/hubzilla-pg-nginx:v7
    configs:
      - source: secrets_loader
        target: /usr/local/bin/load-secrets.sh
        mode: 0755
    environment:
      - DOMAIN=${DOMAIN}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - TIMEZONE=${TIMEZONE}
      - DB_HOST=hub_db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_TYPE=${DB_TYPE}
      - DB_PORT=${DB_PORT}
    secrets:
      - db_password
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        source /usr/local/bin/load-secrets.sh
        exec crond -f
    networks:
      - hubzilla_internal
    volumes:
      - web_root:/var/www/html
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

secrets:
  db_password:
    external: true
    name: hubzilla_db_password
  smtp_password:
    external: true
    name: hubzilla_smtp_password

configs:
  nginx_production_config:
    file: ./config/nginx-internal-production.conf
  secrets_loader:
    file: ./scripts/load-secrets.sh

volumes:
  db_data:
  web_root:
