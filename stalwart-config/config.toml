# Stalwart Mail Server Configuration for Staging/Production
# Uses Let's Encrypt certificates extracted from Traefik

[server.listener."smtp"]
bind = ["[::]:25"]
protocol = "smtp"

[server.listener."submissions"]
bind = ["[::]:465"]
protocol = "smtp"
tls.implicit = true

[server.listener."submission"]
bind = ["[::]:587"]
protocol = "smtp"

[server.listener."imap"]
bind = ["[::]:143"]
protocol = "imap"

[server.listener."imaptls"]
bind = ["[::]:993"]
protocol = "imap"
tls.implicit = true

[server.listener."management"]
bind = ["[::]:8080"]
protocol = "http"

# Storage configuration
[storage]
data = "rocksdb"
fts = "rocksdb"
blob = "rocksdb"
lookup = "rocksdb"
directory = "internal"

[store."rocksdb"]
type = "rocksdb"
path = "/opt/stalwart/data"
compression = "lz4"

# Internal directory for local users
[directory."internal"]
type = "internal"
store = "rocksdb"

# Admin authentication
[authentication.fallback-admin]
user = "admin"
secret = "%{env:STALWART_ADMIN_PASSWORD}%"

# SMTP/IMAP Authentication - Enforces TLS
[session.auth]
mechanisms = [ { if = "local_port != 25 && is_tls", then = "[plain, login]"},
               { else = false } ]
directory = "'internal'"
require = [ { if = "local_port == 587 || local_port == 143", then = true },
            { else = false } ]
must-match-sender = true

[session.auth.errors]
total = 3
wait = "5s"

# Logging
[tracer."stdout"]
type = "stdout"
level = "info"
ansi = false
enable = true

# TLS Certificate Configuration
# Uses certificates extracted from Traefik for mail subdomain
[certificate."default"]
cert = "%{file:/opt/stalwart/etc/ssl/%{env:MAIL_DOMAIN}%.pem}%"
private-key = "%{file:/opt/stalwart/etc/ssl/%{env:MAIL_DOMAIN}%-key.pem}%"
default = true
