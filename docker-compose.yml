networks:
  hubzilla:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

services:
  traefik:
    container_name: hubzilla_traefik
    image: traefik:v3.0
    restart: unless-stopped
    entrypoint: ["/custom-entrypoint.sh"]
    command: ["traefik"]
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "8082:8080"  # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_certs:/certs
      - ./traefik/entrypoint.sh:/custom-entrypoint.sh:ro
      - ${MKCERT_PATH}:/mkcert-ca:ro
    networks:
      hubzilla:
        ipv4_address: 172.20.0.10

  hub_db:
    container_name: hubzilla_database
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      hubzilla:
        ipv4_address: 172.20.0.30
    volumes:
      - db_data:/var/lib/postgresql/data

  hub:
    container_name: hubzilla_itself
    image: catmanmatt/hubzilla-pg-nginx:v7
    # Uncomment to build locally instead of pulling from Docker Hub:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      traefik:
        condition: service_started
      hub_db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      hubzilla:
        ipv4_address: 172.20.0.20
    volumes:
      - web_root:/var/www/html
      - traefik_certs:/var/ssl-shared:ro
      - ${MKCERT_PATH}:/mkcert-ca:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hubzilla.rule=Host(`localhost`)"
      - "traefik.http.routers.hubzilla.entrypoints=websecure"
      - "traefik.http.routers.hubzilla.tls=true"
      - "traefik.http.services.hubzilla.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  hub_cron:
    container_name: hubzilla_cronjob
    image: catmanmatt/hubzilla-pg-nginx:v7
    # Uncomment to build locally instead of pulling from Docker Hub:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      hub_db:
        condition: service_healthy
      hub:
        condition: service_healthy
    env_file:
      - .env
    networks:
      hubzilla:
        ipv4_address: 172.20.0.40
    volumes:
      - web_root:/var/www/html
    command: ["crond", "-f"]

  stalwart:
    container_name: hubzilla_mailserver
    image: stalwartlabs/stalwart:latest
    restart: unless-stopped
    depends_on:
      - hub
    ports:
      - "25:25"
      - "143:143"
      - "993:993"
      - "465:465"
      - "587:587"
      # Port 8080 now proxied through Traefik instead of direct exposure
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stalwart.rule=Host(`mail.localhost`)"
      - "traefik.http.routers.stalwart.entrypoints=websecure"
      - "traefik.http.routers.stalwart.tls=true"
      - "traefik.http.services.stalwart.loadbalancer.server.port=8080"
    volumes:
      - stalwart_data:/opt/stalwart
      - ./stalwart-config/config.toml:/opt/stalwart/etc/config.toml:ro
      - traefik_certs:/var/ssl-shared:ro
      - ./scripts/setup-stalwart-ssl.sh:/usr/local/bin/setup-stalwart-ssl.sh:ro
      - ./scripts/stalwart-entrypoint.sh:/usr/local/bin/stalwart-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/stalwart-entrypoint.sh"]
    environment:
      - STALWART_HOSTNAME=mail.${SMTP_DOMAIN}
      - STALWART_ADMIN_PASSWORD=${STALWART_ADMIN_PASSWORD}
      - DOMAIN=${DOMAIN}
      - MAIL_DOMAIN=${MAIL_DOMAIN}
    networks:
      hubzilla:
        ipv4_address: 172.20.0.50

volumes:
  db_data:
  web_root:
  stalwart_data:
  traefik_certs:
